# Render Blueprint: a free static site. Connect the repo in Render ("New > Blueprint").
services:
  - type: web
    name: cleaning-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SITE_URL
        sync: false # set to the live https:// URL in the Render dashboard
    routes:
      # single-page-app fallback so /about, /services... work on refresh and deep links
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
